<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drone Cockpit</title>

<style>
body { background:#020617; color:#e5e7eb; text-align:center; font-family:Arial; }

.joysticks { display:flex; justify-content:space-around; margin-top:30px; }

.joystick {
  width:160px; height:160px;
  background:#1e293b; border-radius:50%; position:relative;
}

.stick {
  width:60px; height:60px;
  background:#38bdf8; border-radius:50%;
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
}

button { padding:10px 16px; margin:6px; border:none; border-radius:6px; }
.safe { background:#22c55e; }
.danger { background:#ef4444; }
button:disabled { opacity:0.5; }
</style>
</head>

<body>

<h2>🚁 Drone Cockpit</h2>

<div class="joysticks">
  <div class="joystick" id="leftJoy"><div class="stick"></div></div>
  <div class="joystick" id="rightJoy"><div class="stick"></div></div>
</div>

<br>
<input type="number" id="altitude" value="2" min="1" max="50">
<br><br>

<button id="armBtn" class="safe">ARM</button>
<button id="disarmBtn" class="danger" disabled>DISARM</button>

<br>

<button id="takeoffBtn" disabled>TAKEOFF</button>
<button id="landBtn" class="danger" disabled>LAND</button>

<h3>📡 Telemetry</h3>
<p>Mode: <span id="mode">--</span></p>
<p>Altitude: <span id="alt">0</span></p>
<p>Yaw: <span id="yawVal">0</span></p>
<p>Heading: <span id="heading">0</span></p>

<script>
let ws;
let control = { throttle:0, yaw:0, pitch:0, roll:0 };
let droneState = { armed:false, flying:false };
let loopStarted = false;

function safeSend(data){
  if(!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify(data));
}

function connectWS(){
  ws = new WebSocket("wss://jdk-server.onrender.com/control");

  ws.onopen = ()=>{
    console.log("✅ Connected");
    startLoop();
  };

  ws.onclose = ()=>{
    console.log("🔁 Reconnecting...");
    setTimeout(connectWS,2000);
  };

  ws.onmessage = e=>{
    const msg = JSON.parse(e.data);

    if(msg.type==="telemetry"){
      if(msg.alt!==undefined) alt.innerText = msg.alt.toFixed(2);
      if(msg.yaw!==undefined) yawVal.innerText = msg.yaw.toFixed(2);
      if(msg.heading!==undefined) heading.innerText = msg.heading;
    }

    if(msg.type==="status"){
      droneState = msg.state;
      mode.innerText = msg.mode;
      updateButtons();
    }
  };
}
connectWS();

function startLoop(){
  if(loopStarted) return;
  loopStarted = true;

  setInterval(()=>{
    safeSend({type:"control", ...control});
  },50);
}

armBtn.onclick = ()=> safeSend({type:"action", action:"arm"});
disarmBtn.onclick = ()=> safeSend({type:"action", action:"disarm"});
landBtn.onclick = ()=> safeSend({type:"action", action:"land"});

takeoffBtn.onclick = ()=>{
  let altVal = parseFloat(document.getElementById("altitude").value);
  safeSend({type:"action", action:"takeoff", alt:altVal});
};

function updateButtons(){
  armBtn.disabled = droneState.armed;
  disarmBtn.disabled = !droneState.armed;
  takeoffBtn.disabled = !droneState.armed || droneState.flying;
  landBtn.disabled = !droneState.flying;
}

/* Joystick */
function joystick(el, cb){
  const stick = el.querySelector(".stick");
  const r = el.offsetWidth/2;
  let drag=false;

  el.onpointerdown=()=>drag=true;
  el.onpointerup=reset;
  el.onpointerleave=reset;

  el.onpointermove=e=>{
    if(!drag) return;

    const rect=el.getBoundingClientRect();
    let x=e.clientX-rect.left-r;
    let y=e.clientY-rect.top-r;

    const d=Math.min(r, Math.hypot(x,y));
    const a=Math.atan2(y,x);

    x=Math.cos(a)*d;
    y=Math.sin(a)*d;

    stick.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;
    cb(x/r,y/r);
  };

  function reset(){
    drag=false;
    stick.style.transform="translate(-50%,-50%)";
    cb(0,0);
  }
}

joystick(leftJoy,(x,y)=>{
  control.yaw=x;
  control.throttle=-y;
});

joystick(rightJoy,(x,y)=>{
  control.roll=x;
  control.pitch=-y;
});
</script>

</body>
</html>
